name: Build macOS installer (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbs-macos-manual
  cancel-in-progress: false

jobs:
  macos-universal:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Build universal DMG
        run: npm run desktop:build:mac -- --target universal-apple-darwin
      - name: Make portable folder from finished DMG
        shell: bash
        run: |
          set -euo pipefail

          # Tauri removes the temporary .app after bundling the DMG. Get the
          # already-built, signed application from the DMG instead.
          DMG=$(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)
          if [[ -z "$DMG" || ! -f "$DMG" ]]; then
            echo "::error::Tauri finished without a DMG file"
            exit 1
          fi

          MOUNT="$RUNNER_TEMP/hbs-explorer-dmg"
          mkdir -p "$MOUNT" "release/Absolute HbS Explorer/Data"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT

          APP="$MOUNT/Absolute HbS Explorer.app"
          if [[ ! -d "$APP" ]]; then
            echo "::error::App not found in mounted DMG"
            ls -lah "$MOUNT"
            exit 1
          fi
          ditto "$APP" "release/Absolute HbS Explorer/Absolute HbS Explorer.app"
          hdiutil detach "$MOUNT" >/dev/null
          trap - EXIT

          BINARY="release/Absolute HbS Explorer/Absolute HbS Explorer.app/Contents/MacOS/absolute-hbs-explorer"
          test -f "$BINARY"
          lipo "$BINARY" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "release/Absolute HbS Explorer/Absolute HbS Explorer.app"

          printf '%s\n' 'Put HbS_Absolute_Values.xlsx here on an approved local device.' > 'release/Absolute HbS Explorer/Data/PLACE_XLSX_HERE.txt'
          (cd release && ditto -c -k --sequesterRsrc --keepParent 'Absolute HbS Explorer' '../Absolute_HbS_Explorer_macOS_portable.zip')
          test -s Absolute_HbS_Explorer_macOS_portable.zip
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Absolute-HbS-Explorer-macOS-universal-test
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            Absolute_HbS_Explorer_macOS_portable.zip
          if-no-files-found: error
          retention-days: 7
